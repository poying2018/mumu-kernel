# Install the new kernel into the emulator's ext4 boot partition.
#
# The boot partition that holds /kernel is 14317 blocks of 1 KiB and has only
# 335 free blocks. The rebuilt kernel is about 280 KiB larger than the original,
# which still fits, so the partition geometry is left alone: the emulator's
# loader does not cope with a boot partition of a different size.
#
# Use extra_mb=0 for the normal path.
name: build-boot-partition

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag holding the kernel'
        required: true
        default: 'plain-kernel-test'
      release_asset:
        description: 'Asset name of the kernel'
        required: true
        default: 'bzImage'
      kernel_name:
        description: 'Name of the replacement kernel file'
        required: true
        default: 'kernel'
      extra_mb:
        description: 'Extra megabytes to add to the partition'
        required: false
        default: '8'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4
        with:
          path: helper


      - name: Fetch the kernel
        run: |
          set -eu
          cd helper
          curl -sL -o "${{ inputs.kernel_name }}"             "https://github.com/poying2018/mumu-kernel/releases/download/${{ inputs.release_tag }}/${{ inputs.release_asset }}"
          ls -la "${{ inputs.kernel_name }}"

      - name: Install e2fsprogs
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y e2fsprogs
          debugfs -V 2>&1 | head -1

      - name: Grow the filesystem
        run: |
          set -eu
          cd helper
          cp system-part3.ext4 boot.ext4
          # The partition is 28634 sectors of 512 bytes. Growing it changes the
          # partition table, and the emulator's loader does not cope with a
          # boot partition of a different size, so extra_mb=0 keeps the
          # original geometry and only swaps the file.
          NEW_SECTORS=$((28634 + ${{ inputs.extra_mb }} * 2048))
          if [ "${{ inputs.extra_mb }}" != "0" ]; then
            truncate -s $((NEW_SECTORS * 512)) boot.ext4
            echo "new partition size: $NEW_SECTORS sectors ($((NEW_SECTORS * 512 / 1024 / 1024)) MB)"
            sudo resize2fs boot.ext4
          else
            echo "keeping the original partition size"
          fi
          debugfs -R "stats" boot.ext4 2>&1 | grep -iE "block count|free blocks" | head -4

      - name: Install the kernel
        run: |
          set -eu
          cd helper
          bash install-kernel.sh boot.ext4 "${{ inputs.kernel_name }}"

      - name: Check the filesystem
        run: |
          set -eu
          cd helper
          sudo e2fsck -fn boot.ext4 2>&1 | tail -8

      - name: Upload the partition
        uses: actions/upload-artifact@v4
        with:
          name: boot-partition
          path: helper/boot.ext4
          if-no-files-found: error
