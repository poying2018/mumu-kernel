# Build a 6.1.90 kernel for the MuMu emulator with SukiSU built in.
#
# MuMu 12 runs Android 15 on a VirtualBox 7.2.4 x86_64 guest. Its kernel is a
# stock Android GKI 6.1.90 ("perf" flavour) built with Android clang r536225.
#
# The manager identity is selected by the ksu_variant input:
#   sukisu   - the SukiSU manager, cert 0x35c (what this project ships)
#   official - the official KernelSU manager, cert 0x33b, which is the
#              identity MuMu's own kernel was built with. Building both and
#              diffing them locates the bytes that hold the identity.
name: build-mumu-kernel

"on":
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-kernel.yml'
  workflow_dispatch:
    inputs:
      ksu_source:
        description: 'SukiSU source repository'
        required: true
        default: 'SukiSU-Ultra/SukiSU-Ultra'
      ksu_ref:
        description: 'SukiSU git ref'
        required: true
        default: 'main'
      ksu_variant:
        description: 'Manager identity baked into the kernel'
        required: true
        default: 'sukisu'
        type: choice
        options:
          - sukisu
          - official

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the kernel source
        uses: actions/checkout@v4
        with:
          repository: aosp-mirror/kernel_common
          ref: android14-6.1.90_r00
          path: kernel
          fetch-depth: 1
          submodules: false

      - name: Checkout this repository
        uses: actions/checkout@v4
        with:
          path: helper

      - name: Verify the kernel version
        run: |
          set -eu
          cd kernel
          grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL) =' Makefile | head -3
          test "$(grep '^SUBLEVEL =' Makefile | awk '{print $3}')" = "90"

      - name: Fetch SukiSU
        run: |
          set -eu
          git clone --depth 1 --branch "${{ inputs.ksu_ref }}" \
            "https://github.com/${{ inputs.ksu_source }}.git" KernelSU
          cd KernelSU
          git rev-parse HEAD

      - name: Install SukiSU into the kernel tree
        run: |
          set -eu
          cd kernel
          # Copy rather than symlink: the Kconfig parser resolves the path
          # relative to the kernel tree and a link pointing outside it breaks.
          rm -rf drivers/kernelsu
          cp -r "$GITHUB_WORKSPACE/KernelSU/kernel" drivers/kernelsu
          # kernel/include/uapi is a symlink to ../../uapi, i.e. to the
          # repository root, which does not exist once kernel/ is copied on
          # its own. The sources include "uapi/app_profile.h", so the real
          # headers have to sit next to the driver directory.
          rm -f drivers/kernelsu/include/uapi
          cp -r "$GITHUB_WORKSPACE/KernelSU/uapi" drivers/kernelsu/uapi
          ls drivers/kernelsu/uapi/app_profile.h
          grep -q "kernelsu" drivers/Makefile || \
            printf "\nobj-\$(CONFIG_KSU) += kernelsu/\n" >> drivers/Makefile
          grep -q 'source "drivers/kernelsu/Kconfig"' drivers/Kconfig || \
            sed -i '/^endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig
          echo "integration done"

      - name: Add the emulator's vaddress driver object
        run: |
          set -eu
          bash "$GITHUB_WORKSPACE/helper/prepare-vaddress.sh" "$PWD/kernel"

      - name: Install build dependencies
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex libssl-dev libelf-dev libncurses-dev \
            python3 pahole rsync cpio kmod zstd
          bison --version | head -1

      - name: Apply the emulator kernel config
        run: |
          set -eu
          cd kernel
          cp "$GITHUB_WORKSPACE/helper/mumu-kernel.config" .config
          scripts/config --file .config \
            -d LTO_CLANG -e LTO_NONE -d LTO_CLANG_THIN -d LTO_CLANG_FULL -d THINLTO
          make olddefconfig
          make modules_prepare
          make security/selinux/built-in.a
          # SukiSU is built in, not a module. Module support stays on: the
          # emulator's own kernel keeps 2573 drivers as modules, and turning
          # them into built-ins grows the image from 12 MB to 50 MB.
          scripts/config --file .config -e KSU
          make olddefconfig
          # x86_64 needs CONFIG_KSU_X86_PATCH_SYSCALL_DISPATCHER: upstream
          # hardened the syscall table, so the hook has to patch the dispatcher
          # at runtime instead of relying on a source patch.
          scripts/config --file .config -e KSU_X86_PATCH_SYSCALL_DISPATCHER
          make olddefconfig
          grep -E "^CONFIG_KSU" .config || true

      - name: Enable the vaddress driver in the config
        run: |
          set -eu
          bash "$GITHUB_WORKSPACE/helper/link-vaddress.sh" "$PWD/kernel"

      - name: Install the Android clang toolchain
        run: |
          set -eu
          mkdir -p "$HOME/clang"
          curl -sL "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r536225.tar.gz" \
            | tar -xz -C "$HOME/clang"
          "$HOME/clang/bin/clang" --version | head -2

      - name: Build the kernel
        run: |
          set -eu
          cd kernel
          export PATH="$HOME/clang/bin:$PATH"
          export ARCH=x86_64
          export LLVM=1
          export LLVM_IAS=1
          export KBUILD_BUILD_USER=build
          export KBUILD_BUILD_HOST=build-host
          # Build in the source tree; the module build then uses the
          # generated headers from it.
          KDIR="$PWD"
          MDIR="$PWD/kernel"
          ODIR="$PWD/kernel"

          ID_ARGS=""
          if [ "${{ inputs.ksu_variant }}" = "official" ]; then
            ID_ARGS="KSU_EXPECTED_SIZE=0x33b"
            ID_ARGS="$ID_ARGS KSU_EXPECTED_HASH=c371061b19d8c7d7d6133c6a9bafe198fa944e50c1b31c9d8daa8d7f1fc2d2d6"
            ID_ARGS="$ID_ARGS KSU_PACKAGE_NAME=me.weishu.kernelsu"
          fi
          echo "identity args: $ID_ARGS"

          make -k -C "$MDIR" M="$ODIR" src="$MDIR" ARCH=x86_64 CC=clang LLVM=1 LLVM_IAS=1 \
            CONFIG_KSU=m CONFIG_KSU_X86_PATCH_SYSCALL_DISPATCHER=y \
            KSU_VERSION=30001 KSU_VERSION_TAG=local \
            $ID_ARGS \
            modules -j"$(nproc)"
          ls -la "$MDIR"/../arch/x86/boot/bzImage 2>/dev/null || \
            ls -la arch/x86/boot/bzImage 2>/dev/null || true
          find . -name bzImage -newermt '-10 minutes' | head -3
          echo "sha256: $(sha256sum arch/x86/boot/bzImage | cut -d' ' -f1)"

      - name: Check the MuMu vaddress module against this kernel
        run: |
          set -eu
          cd kernel
          if [ ! -f Module.symvers ]; then
            echo "no Module.symvers produced"
            exit 1
          fi
          curl -sL -o /tmp/vaddress.ko \
            "https://github.com/poying2018/mumu-kernel/releases/download/plain-kernel-test/vaddress-ko"
          ls -la /tmp/vaddress.ko
          python3 check-ko-crc.py Module.symvers /tmp/vaddress.ko

      - name: Check the MuMu vaddress module against this kernel
        run: |
          set -eu
          cd kernel
          if [ ! -f Module.symvers ]; then
            echo "no Module.symvers produced"
            exit 1
          fi
          curl -sL -o /tmp/vaddress.ko \
            "https://github.com/poying2018/mumu-kernel/releases/download/plain-kernel-test/vaddress-ko"
          ls -la /tmp/vaddress.ko
          python3 check-ko-crc.py Module.symvers /tmp/vaddress.ko

      - name: Show kernel info
        run: |
          set -eu
          cd kernel
          strings arch/x86/boot/bzImage | grep -E '^Linux version 6\.1' | head -1
          grep -E "^CONFIG_KSU" .config || true

      - name: Upload the kernel image
        uses: actions/upload-artifact@v4
        with:
          name: bzImage-${{ inputs.ksu_variant }}-${{ inputs.kmi }}
          path: kernel/arch/x86/boot/bzImage
          if-no-files-found: error
