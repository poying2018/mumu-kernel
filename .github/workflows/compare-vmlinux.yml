# Compare the original MuMu kernel with a rebuilt one.
#
# MuMu's own kernel is a stock Android GKI 6.1.90 with SukiSU built in and
# the official KernelSU manager identity baked in. Rebuilding the same source
# with the same identity should produce an almost identical image, so a diff
# points at whatever MuMu changed, and at the bytes holding the manager
# identity.
name: compare-vmlinux

on:
  workflow_dispatch:
    inputs:
      ksu_variant:
        description: 'Manager identity to bake in'
        required: true
        default: 'official'
        type: choice
        options:
          - official
          - sukisu

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4
        with:
          path: helper

      - name: Fetch both kernels
        run: |
          set -eu
          cd helper
          curl -sL -o kernel-orig.bin \
            "https://github.com/poying2018/mumu-kernel/releases/download/plain-kernel-test/kernel"
          ls -la kernel-orig.bin
          curl -sL -o kernel-new.bin \
            "https://github.com/poying2018/mumu-kernel/releases/download/${{ inputs.ksu_variant }}-kernel/bzImage"
          ls -la kernel-new.bin

      - name: Extract the vmlinux images
        run: |
          set -eu
          cd helper
          # the kernel source ships the extractor
          curl -sL -o extract-vmlinux \
            "https://raw.githubusercontent.com/torvalds/linux/v6.1/scripts/extract-vmlinux"
          chmod +x extract-vmlinux
          ./extract-vmlinux kernel-orig.bin > vmlinux-orig.bin || true
          ./extract-vmlinux kernel-new.bin > vmlinux-new.bin || true
          ls -la vmlinux-*.bin 2>/dev/null || true

      - name: Compare the manager identity constants
        run: |
          set -eu
          cd helper
          for f in vmlinux-orig.bin vmlinux-new.bin; do
            [ -f "$f" ] || continue
            echo "=== $f ==="
            strings "$f" | grep -E "^[0-9a-f]{64}$" | sort -u | head -10
            echo "--- ksu symbols ---"
            nm "$f" 2>/dev/null | grep -iE "expected_size|expected_hash|manager" | head -10
          done

      - name: Diff the two images
        run: |
          set -eu
          cd helper
          if [ -f vmlinux-orig.bin ] && [ -f vmlinux-new.bin ]; then
            echo "sizes: $(stat -c%s vmlinux-orig.bin) vs $(stat -c%s vmlinux-new.bin)"
            cmp -l vmlinux-orig.bin vmlinux-new.bin 2>/dev/null | head -40 || true
            echo "differing byte count:"
            cmp -l vmlinux-orig.bin vmlinux-new.bin 2>/dev/null | wc -l || true
          fi

      - name: Upload the extracted images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vmlinux-compare-${{ inputs.ksu_variant }}
          path: |
            helper/vmlinux-*.bin
          if-no-files-found: ignore
