# Locate the manager identity inside the original MuMu kernel.
#
# MuMu's kernel is a stock Android GKI 6.1.90 with SukiSU built in, using the
# official KernelSU manager identity. The manager certificate hash and length
# are compile time constants, so finding them in the image gives the bytes a
# patch has to change to make the kernel accept the SukiSU manager instead.
name: compare-vmlinux

on:
  workflow_dispatch:
    inputs:
      kernel_release:
        description: 'Release holding the original kernel'
        required: true
        default: 'plain-kernel-test'
      kernel_asset:
        description: 'Asset name of the original kernel'
        required: true
        default: 'kernel'
      manager_hash:
        description: 'Manager certificate SHA-256 the kernel was built with'
        required: true
        default: 'c371061b19d8c7d7d6133c6a9bafe198fa944e50c1b31c9d8daa8d7f1fc2d2d6'

permissions:
  contents: read

jobs:
  locate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4
        with:
          path: helper

      - name: Fetch the original kernel
        run: |
          set -eu
          cd helper
          curl -sL -o kernel-orig.bin \
            "https://github.com/poying2018/mumu-kernel/releases/download/${{ inputs.kernel_release }}/${{ inputs.kernel_asset }}"
          ls -la kernel-orig.bin

      - name: Locate the identity constants
        run: |
          set -eu
          cd helper
          python3 locate-identity.py kernel-orig.bin "${{ inputs.manager_hash }}"

      - name: Report
        run: |
          set -eu
          cd helper
          cat hash_offset.txt
          python3 -c "
import re
data = open('kernel-orig.bin','rb').read()
off = int(open('hash_offset.txt').read(), 16)
start = max(0, off - 0x4000)
chunk = data[start:off+0x4000]
for m in re.finditer(rb'[ -~]{8,}', chunk):
    print('%08x %s' % (start + m.start(), m.group().decode(errors='replace')))
" | head -60
